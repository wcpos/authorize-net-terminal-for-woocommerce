name: Release

on:
  push:
    branches: [main]

concurrency: { group: release, cancel-in-progress: false }

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*\([^[:space:]]*\).*/\1/p' authorize-net-terminal-for-woocommerce.php | head -n1)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1 || gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION exists; nothing to publish"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup PHP 7.4
        if: steps.check.outputs.publish == 'true'
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # v2.35.5
        with:
          php-version: '7.4'
          coverage: none

      - name: Build
        if: steps.check.outputs.publish == 'true'
        run: bash scripts/build-zip.sh "$RUNNER_TEMP/out"

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          test -f "docs/releases/$VERSION.md"
          gh release create "v$VERSION" "$RUNNER_TEMP/out/authorize-net-terminal-for-woocommerce.zip" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file "docs/releases/$VERSION.md" --latest
